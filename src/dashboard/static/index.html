<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventLab Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --blue: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-size: 13px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }

  .layout {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 16px;
  }

  .panel {
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }

  .panel-title {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .markets {
    display: flex;
    align-items: center;
    padding: 8px;
    gap: 6px;
    overflow-x: auto;
  }

  .market {
    min-width: 104px;
    min-height: 34px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font: inherit;
    text-align: center;
    cursor: pointer;
    white-space: nowrap;
  }

  .market:hover,
  .market.active {
    border-color: var(--blue);
    background: rgba(88, 166, 255, 0.12);
  }

  .market-detail {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 12px;
    border-top: 1px solid var(--border);
  }

  .market-detail[hidden] {
    display: none;
  }

  .market-detail-main {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .market-detail-title {
    overflow: hidden;
    color: var(--text);
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .market-quotes {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    color: var(--muted);
    font-size: 12px;
  }

  .quote-label {
    color: var(--muted);
  }

  .quote-price {
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .market-link {
    flex: 0 0 auto;
    color: var(--blue);
    text-decoration: none;
    white-space: nowrap;
  }

  .market-link:hover {
    text-decoration: underline;
  }

  .dashboard-detail {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 12px;
  }

  .chart-row {
    min-width: 0;
  }

  .chart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 10px;
    letter-spacing: 0;
    text-transform: none;
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--muted);
  }

  .legend-swatch {
    width: 10px;
    height: 2px;
    border-radius: 999px;
    background: currentColor;
  }

  .legend-item.yes { color: var(--green); }
  .legend-item.no { color: var(--red); }
  .legend-item.btc { color: var(--yellow); }

  .chart-frame {
    position: relative;
    width: 100%;
    height: 220px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .trade-position-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 12px;
  }

  .subpanel {
    min-height: 118px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
  }

  .subpanel-title {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .placeholder {
    padding: 14px 10px;
    color: var(--muted);
    line-height: 1.5;
  }

  .empty {
    padding: 12px;
    color: var(--muted);
  }

  @media (max-width: 720px) {
    body { padding: 12px; }
    .header { align-items: flex-start; flex-direction: column; }
    .market-detail {
      align-items: flex-start;
      flex-direction: column;
    }
    .market-detail-title {
      white-space: normal;
    }
    .chart-frame { height: 180px; }
    .chart-header { align-items: flex-start; flex-direction: column; }
    .legend { justify-content: flex-start; }
    .trade-position-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header class="header">
    <h1>EventLab Dashboard</h1>
    <div class="status">
      <span id="latency">--</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="markets" id="markets">
        <div class="empty">Waiting for backend state...</div>
      </div>
      <div class="market-detail" id="market-detail" hidden>
        <div class="market-detail-main">
          <div class="market-detail-title" id="market-title"></div>
          <div class="market-quotes" id="market-quotes">
            <span><span class="quote-label">UP BID</span> <span class="quote-price" id="up-bid">--</span></span>
            <span><span class="quote-label">UP ASK</span> <span class="quote-price" id="up-ask">--</span></span>
            <span><span class="quote-label">DOWN BID</span> <span class="quote-price" id="down-bid">--</span></span>
            <span><span class="quote-label">DOWN ASK</span> <span class="quote-price" id="down-ask">--</span></span>
            <span id="btc-base-item"><span class="quote-label">BTC BASE</span> <span class="quote-price" id="btc-base">--</span></span>
            <span id="btc-diff-item"><span class="quote-label">BTC DIFF</span> <span class="quote-price" id="btc-diff">--</span></span>
            <span id="btc-now-item"><span class="quote-label">BTC NOW</span> <span class="quote-price" id="btc-now">--</span></span>
          </div>
        </div>
        <a class="market-link" id="market-link" target="_blank" rel="noopener noreferrer">Polymarket</a>
      </div>
    </section>

    <section class="panel">
      <div class="dashboard-detail">
        <div class="chart-row">
          <div class="chart-header">
            <span>Token Prices</span>
            <div class="legend">
              <span class="legend-item yes"><span class="legend-swatch"></span>UP</span>
              <span class="legend-item no"><span class="legend-swatch"></span>DOWN</span>
            </div>
          </div>
          <div class="chart-frame">
            <canvas id="token-chart"></canvas>
          </div>
        </div>
        <div class="chart-row">
          <div class="chart-header">
            <span>BTC Diff</span>
            <div class="legend">
              <span class="legend-item btc"><span class="legend-swatch"></span>BTC diff</span>
            </div>
          </div>
          <div class="chart-frame">
            <canvas id="btc-chart"></canvas>
          </div>
        </div>
        <div class="trade-position-row">
          <section class="subpanel">
            <div class="subpanel-title">Orders</div>
            <div class="placeholder">Loading...</div>
          </section>
          <section class="subpanel">
            <div class="subpanel-title">Positions</div>
            <div class="placeholder">Loading...</div>
          </section>
        </div>
      </div>
    </section>
  </main>

<script>
const $ = id => document.getElementById(id);
const FIVE_MINUTES_MS = 5 * 60 * 1000;
const CHART_SAMPLE_INTERVAL_MS = 33;
const PRICE_BLEND_DURATION_MS = 280;
const CHART_FIELDS = ['yes', 'no', 'btc', 'btcBase', 'btcDiff'];

let ws;
let reconnectDelay = 1000;
let activeMarketId = null;
let userSelectedMarket = false;
let detailsRenderQueued = false;
let chartAnimationFrame = null;
let lastChartRenderMs = 0;
const marketStates = new Map();
const marketHistory = new Map();
const marketChartAnimations = new Map();
const cssVars = new Map();
const historyLoads = new Map();

async function loadInitialMarkets() {
  try {
    const response = await fetch('/markets');
    if (!response.ok) return;
    const markets = await response.json();
    for (const market of markets) {
      if (!marketStates.has(market.slug)) {
        marketStates.set(market.slug, buildMinimalState(market));
      }
    }
    if (markets.length === 0) return;
    activeMarketId = getDefaultMarketId();
    if (activeMarketId) {
      await loadMarketHistory(activeMarketId);
    }
    renderMarkets();
    renderActiveDetail();
  } catch (error) {
    console.error('Failed to load initial markets', error);
  }
}

function buildMinimalState(market) {
  return {
    ts_ms: null,
    market: {
      slug: market.slug,
      title: null,
      start_ts_s: market.start_ts_s,
      end_ts_s: market.end_ts_s,
    },
    yes_token_quote: { bid: null, ask: null, mid: null },
    no_token_quote: { bid: null, ask: null, mid: null },
    crypto_quote: { curr: null, base: null, diff: null },
    yes_position: null,
    no_position: null,
  };
}

function loadMarketHistory(marketId) {
  const inflight = historyLoads.get(marketId);
  if (inflight) return inflight;

  const promise = (async () => {
    try {
      const response = await fetch(`/market/${encodeURIComponent(marketId)}/history`);
      if (!response.ok) return;
      const data = await response.json();
      applyHistoryFromApi(marketId, data);
    } catch (error) {
      console.error('Failed to load history', marketId, error);
    } finally {
      historyLoads.delete(marketId);
    }
  })();

  historyLoads.set(marketId, promise);
  return promise;
}

function applyHistoryFromApi(marketId, data) {
  const samples = data.samples.map(s => ({
    tsMs: s.ts_ms,
    yes: midOf(s.yes_bid, s.yes_ask),
    no: midOf(s.no_bid, s.no_ask),
    btc: toFiniteNumber(s.btc_curr),
    btcBase: null,
    btcDiff: toFiniteNumber(s.btc_diff),
  }));
  marketHistory.set(marketId, samples);

  const state = marketStates.get(marketId);
  if (state && samples.length > 0) {
    const lastRaw = data.samples[data.samples.length - 1];
    state.ts_ms = lastRaw.ts_ms;
    state.yes_token_quote = {
      bid: lastRaw.yes_bid,
      ask: lastRaw.yes_ask,
      mid: midOf(lastRaw.yes_bid, lastRaw.yes_ask),
    };
    state.no_token_quote = {
      bid: lastRaw.no_bid,
      ask: lastRaw.no_ask,
      mid: midOf(lastRaw.no_bid, lastRaw.no_ask),
    };
    state.crypto_quote = {
      curr: lastRaw.btc_curr,
      base: state.crypto_quote?.base ?? null,
      diff: lastRaw.btc_diff,
    };
  }

  const animation = getChartAnimation(marketId);
  const windowRange = state ? getTimeWindow(state) : null;
  if (samples.length > 0) {
    const last = samples[samples.length - 1];
    for (const field of CHART_FIELDS) {
      animation.display[field] = last[field];
      animation.target[field] = last[field];
      animation.transition[field] = null;
    }
    animation.hasDisplay = true;
    animation.lastSampleTsMs = last.tsMs;
    if (windowRange) animation.windowRange = windowRange;
  }
}

function midOf(bid, ask) {
  const bidNum = toFiniteNumber(bid);
  const askNum = toFiniteNumber(ask);
  if (bidNum == null && askNum == null) return null;
  if (bidNum == null) return askNum;
  if (askNum == null) return bidNum;
  return (bidNum + askNum) / 2;
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    reconnectDelay = 1000;
  };

  ws.onclose = () => {
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
  };

  ws.onerror = () => {
    console.error('Dashboard websocket error');
  };

  ws.onmessage = event => {
    const state = decodeState(event.data);
    if (!state) return;

    const marketId = getMarketId(state);
    const hadMarket = marketStates.has(marketId);
    const previousActiveMarketId = activeMarketId;
    marketStates.set(marketId, state);
    appendHistory(marketId, state);
    if (!activeMarketId || !marketStates.has(activeMarketId) || !userSelectedMarket) {
      activeMarketId = getDefaultMarketId();
      userSelectedMarket = false;
    }

    $('latency').textContent = formatLatency(state.ts_ms);
    if (!hadMarket || activeMarketId !== previousActiveMarketId) {
      renderMarkets();
    }
    if (marketId === activeMarketId || activeMarketId !== previousActiveMarketId) {
      scheduleDetailsRender();
    }
  };
}

function decodeState(data) {
  try {
    const text = data instanceof ArrayBuffer ? new TextDecoder().decode(data) : data;
    return JSON.parse(text);
  } catch (error) {
    console.error('Invalid dashboard state', error);
    return null;
  }
}

function getMarketId(state) {
  return state.market?.slug || state.worker_id || 'market';
}

function getMarketTitle(state) {
  const startTsS = state.market?.start_ts_s;
  const endTsS = state.market?.end_ts_s;
  if (startTsS == null || endTsS == null) return getMarketId(state);
  return `${formatHourMinute(startTsS)}-${formatHourMinute(endTsS)}`;
}

function getMarketFullTitle(state) {
  return state.market?.title || getMarketId(state);
}

function getDefaultMarketId() {
  const nowS = Date.now() / 1000;
  const entries = [...marketStates.entries()];
  const current = entries
    .filter(([, state]) => {
      const startTsS = state.market?.start_ts_s;
      const endTsS = state.market?.end_ts_s;
      return startTsS != null && endTsS != null && startTsS <= nowS && nowS < endTsS;
    })
    .sort((left, right) => (right[1].market?.start_ts_s || 0) - (left[1].market?.start_ts_s || 0));

  if (current.length > 0) return current[0][0];

  const latest = entries.sort((left, right) => {
    return (right[1].market?.start_ts_s || 0) - (left[1].market?.start_ts_s || 0);
  });
  return latest[0]?.[0] || null;
}

function formatLatency(tsMs) {
  if (tsMs == null) return '--';
  return `${Date.now() - tsMs}ms`;
}

function formatPrice(value) {
  const number = Number(value);
  return Number.isFinite(number) ? number.toFixed(2) : '--';
}

function formatSignedPrice(value) {
  const number = Number(value);
  if (!Number.isFinite(number)) return '--';
  return `${number >= 0 ? '+' : ''}${number.toFixed(2)}`;
}

function formatHourMinute(tsS) {
  return new Date(tsS * 1000).toLocaleTimeString(undefined, {
    hour: '2-digit',
    minute: '2-digit',
    hour12: false,
  });
}

function renderMarkets() {
  const markets = $('markets');
  markets.innerHTML = '';

  const entries = [...marketStates.entries()].sort((left, right) => {
    return (left[1].market?.start_ts_s || 0) - (right[1].market?.start_ts_s || 0);
  });

  for (const [marketId, state] of entries) {
    const button = document.createElement('button');

    button.type = 'button';
    button.className = 'market' + (marketId === activeMarketId ? ' active' : '');
    button.textContent = getMarketTitle(state);

    button.onpointerdown = event => {
      event.preventDefault();
      selectMarket(marketId);
    };
    button.onclick = () => selectMarket(marketId);
    markets.appendChild(button);
  }
}

function selectMarket(marketId) {
  activeMarketId = marketId;
  userSelectedMarket = true;
  renderMarkets();
  sampleActiveChart(Date.now(), true);
  renderActiveDetail();

  const samples = marketHistory.get(marketId);
  if (!samples || samples.length === 0) {
    loadMarketHistory(marketId).then(() => {
      if (activeMarketId === marketId) {
        sampleActiveChart(Date.now(), true);
        renderActiveDetail();
      }
    });
  }
}

function renderActiveDetail() {
  renderMarketDetail();
  renderDetails();
}

function scheduleDetailsRender() {
  if (detailsRenderQueued) return;
  detailsRenderQueued = true;

  const scheduleFrame = window.requestAnimationFrame || (callback => setTimeout(callback, 16));
  scheduleFrame(() => {
    detailsRenderQueued = false;
    renderActiveDetail();
  });
}

function renderMarketDetail() {
  const detail = $('market-detail');
  const state = marketStates.get(activeMarketId);
  if (!state) {
    detail.hidden = true;
    $('market-title').textContent = '';
    renderMarketQuotes(null);
    $('market-link').removeAttribute('href');
    return;
  }

  const slug = state.market?.slug;
  detail.hidden = false;
  $('market-title').textContent = getMarketFullTitle(state);
  renderMarketQuotes(state);

  const link = $('market-link');
  if (slug) {
    link.href = `https://polymarket.com/event/${encodeURIComponent(slug)}`;
    link.hidden = false;
  } else {
    link.removeAttribute('href');
    link.hidden = true;
  }
}

function renderMarketQuotes(state) {
  $('up-bid').textContent = formatPrice(state?.yes_token_quote?.bid);
  $('up-ask').textContent = formatPrice(state?.yes_token_quote?.ask);
  $('down-bid').textContent = formatPrice(state?.no_token_quote?.bid);
  $('down-ask').textContent = formatPrice(state?.no_token_quote?.ask);

  const showBtc = isCurrentMarket(state);
  $('btc-base-item').hidden = !showBtc;
  $('btc-diff-item').hidden = !showBtc;
  $('btc-now-item').hidden = !showBtc;

  $('btc-base').textContent = formatPrice(state?.crypto_quote?.base);
  $('btc-diff').textContent = formatSignedPrice(state?.crypto_quote?.diff);
  $('btc-now').textContent = formatPrice(state?.crypto_quote?.curr);
}

function isCurrentMarket(state) {
  const startTsS = state?.market?.start_ts_s;
  const endTsS = state?.market?.end_ts_s;
  const nowS = Date.now() / 1000;
  return startTsS != null && endTsS != null && startTsS <= nowS && nowS < endTsS;
}

function appendHistory(marketId, state) {
  const tsMs = Number(state.ts_ms);
  if (!Number.isFinite(tsMs)) return;

  ingestChartSample(marketId, {
    tsMs,
    yes: getMidPrice(state?.yes_token_quote),
    no: getMidPrice(state?.no_token_quote),
    btc: toFiniteNumber(state?.crypto_quote?.curr),
    btcBase: toFiniteNumber(state?.crypto_quote?.base),
    btcDiff: getBtcDiff(state?.crypto_quote),
  }, getTimeWindow(state));
}

function ingestChartSample(marketId, sample, windowRange) {
  const nowMs = Date.now();
  const animation = getChartAnimation(marketId);
  animation.windowRange = windowRange;

  if (!animation.hasDisplay) {
    for (const field of CHART_FIELDS) {
      animation.display[field] = sample[field];
      animation.target[field] = sample[field];
      animation.transition[field] = null;
    }
    animation.hasDisplay = true;
    appendDisplayedSample(marketId, sample.tsMs, animation.display, windowRange, true);
    return;
  }

  syncAnimatedValues(animation, nowMs);
  for (const field of CHART_FIELDS) {
    const nextValue = sample[field];
    if (nextValue == null) continue;

    const currentValue = animation.display[field];
    if (currentValue == null) {
      animation.display[field] = nextValue;
      animation.target[field] = nextValue;
      animation.transition[field] = null;
      continue;
    }

    if (Math.abs(currentValue - nextValue) < 0.000001) {
      animation.target[field] = nextValue;
      animation.transition[field] = null;
      continue;
    }

    animation.target[field] = nextValue;
    animation.transition[field] = {
      startMs: nowMs,
      endMs: nowMs + PRICE_BLEND_DURATION_MS,
      from: currentValue,
      to: nextValue,
    };
  }
}

function getChartAnimation(marketId) {
  let animation = marketChartAnimations.get(marketId);
  if (!animation) {
    animation = {
      hasDisplay: false,
      lastSampleTsMs: null,
      windowRange: null,
      display: {},
      target: {},
      transition: {},
    };
    marketChartAnimations.set(marketId, animation);
  }
  return animation;
}

function sampleActiveChart(nowMs, force) {
  const state = marketStates.get(activeMarketId);
  if (!state) return;

  const animation = marketChartAnimations.get(activeMarketId);
  if (!animation?.hasDisplay) return;

  const windowRange = getTimeWindow(state);
  animation.windowRange = windowRange;
  syncAnimatedValues(animation, nowMs);

  const sampleTsMs = Math.min(Math.max(nowMs, windowRange.startMs), windowRange.endMs);
  const elapsedSinceSample = animation.lastSampleTsMs == null
    ? Infinity
    : sampleTsMs - animation.lastSampleTsMs;

  if (!force && elapsedSinceSample < CHART_SAMPLE_INTERVAL_MS) return;
  appendDisplayedSample(activeMarketId, sampleTsMs, animation.display, windowRange, false);
}

function syncAnimatedValues(animation, nowMs) {
  for (const field of CHART_FIELDS) {
    const transition = animation.transition[field];
    if (!transition) {
      animation.display[field] = animation.target[field];
      continue;
    }

    if (nowMs >= transition.endMs) {
      animation.display[field] = transition.to;
      animation.transition[field] = null;
      continue;
    }

    const progress = (nowMs - transition.startMs) / Math.max(transition.endMs - transition.startMs, 1);
    const eased = smoothStep(Math.min(Math.max(progress, 0), 1));
    animation.display[field] = transition.from + (transition.to - transition.from) * eased;
  }
}

function appendDisplayedSample(marketId, tsMs, values, windowRange, force) {
  const animation = getChartAnimation(marketId);
  if (!force && animation.lastSampleTsMs != null && tsMs <= animation.lastSampleTsMs) return;

  const samples = marketHistory.get(marketId) || [];
  const sample = { tsMs };
  for (const field of CHART_FIELDS) {
    sample[field] = values[field] ?? null;
  }
  samples.push(sample);
  animation.lastSampleTsMs = tsMs;

  const maxTsMs = Math.max(windowRange.endMs, tsMs);
  const pruned = samples.filter(existingSample => {
    return existingSample.tsMs >= windowRange.startMs && existingSample.tsMs <= maxTsMs;
  });

  marketHistory.set(marketId, pruned);
}

function smoothStep(value) {
  return value * value * (3 - 2 * value);
}

function getMidPrice(quote) {
  const bid = toFiniteNumber(quote?.bid);
  const ask = toFiniteNumber(quote?.ask);
  if (bid == null && ask == null) return null;
  if (bid == null) return ask;
  if (ask == null) return bid;
  return (bid + ask) / 2;
}

function getBtcDiff(quote) {
  const diff = toFiniteNumber(quote?.diff);
  if (diff != null) return diff;

  const curr = toFiniteNumber(quote?.curr);
  const base = toFiniteNumber(quote?.base);
  if (curr == null || base == null) return null;
  return curr - base;
}

function toFiniteNumber(value) {
  if (value == null || value === '') return null;
  const number = Number(value);
  return Number.isFinite(number) ? number : null;
}

function getTimeWindow(state) {
  const startTsS = Number(state?.market?.start_ts_s);
  const endTsS = Number(state?.market?.end_ts_s);
  if (Number.isFinite(startTsS) && Number.isFinite(endTsS) && endTsS > startTsS) {
    const startMs = startTsS * 1000;
    return { startMs, endMs: startMs + FIVE_MINUTES_MS };
  }

  const nowMs = Date.now();
  return { startMs: nowMs - FIVE_MINUTES_MS, endMs: nowMs };
}

function renderDetails() {
  const state = marketStates.get(activeMarketId);
  if (!state) {
    drawEmptyChart($('token-chart'), 'Waiting for backend state...');
    drawEmptyChart($('btc-chart'), 'Waiting for backend state...');
    return;
  }

  sampleActiveChart(Date.now(), false);
  const history = marketHistory.get(activeMarketId) || [];
  const windowRange = getTimeWindow(state);
  drawTokenChart($('token-chart'), history, windowRange);
  drawBtcChart($('btc-chart'), history, windowRange);
}

function drawTokenChart(canvas, history, windowRange) {
  drawChart(canvas, {
    series: [
      { color: getCssVar('--green'), samples: history.map(sample => ({ x: sample.tsMs, y: sample.yes })) },
      { color: getCssVar('--red'), samples: history.map(sample => ({ x: sample.tsMs, y: sample.no })) },
    ],
    xMin: windowRange.startMs,
    xMax: windowRange.endMs,
    yMin: 0,
    yMax: 1,
    yTicks: [0, 0.25, 0.5, 0.75, 1],
    yFormat: value => value.toFixed(2),
    emptyText: 'Waiting for token prices...',
  });
}

function drawBtcChart(canvas, history, windowRange) {
  const diffs = history.map(sample => sample.btcDiff).filter(value => value != null);

  if (diffs.length === 0) {
    drawEmptyChart(canvas, 'Waiting for BTC diff...');
    return;
  }

  let yMin = Math.min(0, ...diffs);
  let yMax = Math.max(0, ...diffs);
  const absMax = Math.max(Math.abs(yMin), Math.abs(yMax), 5);
  const roundedMax = Math.ceil((absMax * 1.15) / 20) * 20;
  yMin = -roundedMax;
  yMax = roundedMax;

  const ticks = buildTicks(yMin, yMax, 5);
  if (!ticks.includes(0)) {
    ticks.push(0);
    ticks.sort((left, right) => left - right);
  }

  drawChart(canvas, {
    series: [
      { color: getCssVar('--yellow'), samples: history.map(sample => ({ x: sample.tsMs, y: sample.btcDiff })) },
    ],
    xMin: windowRange.startMs,
    xMax: windowRange.endMs,
    yMin,
    yMax,
    yTicks: ticks,
    yFormat: value => `${value > 0 ? '+' : ''}${value.toFixed(0)}`,
    emptyText: 'Waiting for BTC diff...',
  });
}

function drawChart(canvas, config) {
  const { ctx, width, height } = setupCanvas(canvas);
  const padding = { top: 16, right: 18, bottom: 34, left: 62 };
  const plot = {
    x: padding.left,
    y: padding.top,
    w: Math.max(width - padding.left - padding.right, 1),
    h: Math.max(height - padding.top - padding.bottom, 1),
  };

  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = getCssVar('--bg');
  ctx.fillRect(0, 0, width, height);

  const hasData = config.series.some(series => {
    return series.samples.some(sample => {
      return sample.y != null && sample.x >= config.xMin && sample.x <= config.xMax;
    });
  });

  drawAxes(ctx, plot, config);
  if (config.zeroLine) {
    drawZeroLine(ctx, plot, config);
  }
  if (!hasData) {
    drawCenteredText(ctx, width, height, config.emptyText);
    return;
  }

  drawProgressMarker(ctx, plot, config);

  for (const series of config.series) {
    drawSeries(ctx, plot, series, config);
  }
}

function setupCanvas(canvas) {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const width = Math.max(Math.floor(rect.width), 1);
  const height = Math.max(Math.floor(rect.height), 1);
  const pixelWidth = Math.max(Math.floor(width * dpr), 1);
  const pixelHeight = Math.max(Math.floor(height * dpr), 1);

  if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
    canvas.width = pixelWidth;
    canvas.height = pixelHeight;
  }

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, width, height };
}

function drawAxes(ctx, plot, config) {
  ctx.save();
  ctx.strokeStyle = getCssVar('--border');
  ctx.lineWidth = 1;
  ctx.fillStyle = getCssVar('--muted');
  ctx.font = '11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace';
  ctx.textBaseline = 'middle';

  for (const tick of config.yTicks) {
    const y = yToPx(tick, plot, config);
    ctx.beginPath();
    ctx.moveTo(plot.x, y);
    ctx.lineTo(plot.x + plot.w, y);
    ctx.stroke();
    ctx.textAlign = 'right';
    ctx.fillText(config.yFormat(tick), plot.x - 8, y);
  }

  const xTicks = buildRelativeTimeTicks(config.xMin, config.xMax);
  ctx.textBaseline = 'top';
  for (const tick of xTicks) {
    const x = xToPx(tick, plot, config);
    ctx.beginPath();
    ctx.moveTo(x, plot.y);
    ctx.lineTo(x, plot.y + plot.h);
    ctx.stroke();
    if (shouldLabelRelativeTick(tick, config.xMin, config.xMax)) {
      ctx.textAlign = tick === config.xMin ? 'left' : tick === config.xMax ? 'right' : 'center';
      ctx.fillText(formatRelativeChartTime(tick, config.xMin), x, plot.y + plot.h + 8);
    }
  }

  ctx.restore();
}

function drawZeroLine(ctx, plot, config) {
  if (config.yMin > 0 || config.yMax < 0) return;

  const y = yToPx(0, plot, config);
  ctx.save();
  ctx.strokeStyle = getCssVar('--muted');
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(plot.x, y);
  ctx.lineTo(plot.x + plot.w, y);
  ctx.stroke();
  ctx.restore();
}

function drawProgressMarker(ctx, plot, config) {
  const markerTsMs = getLatestVisibleSampleTs(config);
  if (markerTsMs == null) return;

  const x = xToPx(markerTsMs, plot, config);
  const countdown = formatCountdownTime(config.xMax - markerTsMs);

  ctx.save();
  ctx.strokeStyle = 'rgba(230, 237, 243, 0.55)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 5]);
  ctx.beginPath();
  ctx.moveTo(x, plot.y);
  ctx.lineTo(x, plot.y + plot.h);
  ctx.stroke();

  ctx.setLineDash([]);
  ctx.font = '11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';

  const labelY = plot.y + plot.h + 8;
  const textWidth = ctx.measureText(countdown).width;
  const labelX = Math.min(
    Math.max(x, plot.x + textWidth / 2 + 4),
    plot.x + plot.w - textWidth / 2 - 4,
  );

  ctx.fillStyle = getCssVar('--bg');
  ctx.fillRect(labelX - textWidth / 2 - 4, labelY - 2, textWidth + 8, 15);
  ctx.fillStyle = getCssVar('--text');
  ctx.fillText(countdown, labelX, labelY);
  ctx.restore();
}

function drawSeries(ctx, plot, series, config) {
  const points = [];
  for (const sample of series.samples) {
    if (sample.y == null || sample.x < config.xMin || sample.x > config.xMax) continue;

    const point = {
      x: xToPx(sample.x, plot, config),
      y: yToPx(sample.y, plot, config),
    };
    const last = points[points.length - 1];
    if (last && Math.round(last.x) === Math.round(point.x)) {
      points[points.length - 1] = point;
    } else {
      points.push(point);
    }
  }

  if (points.length === 0) return;

  ctx.save();
  ctx.strokeStyle = series.color;
  ctx.fillStyle = series.color;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  ctx.beginPath();
  drawSmoothPath(ctx, points);
  ctx.stroke();

  const last = points[points.length - 1];
  ctx.beginPath();
  ctx.arc(last.x, last.y, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawSmoothPath(ctx, points) {
  ctx.moveTo(points[0].x, points[0].y);
  if (points.length === 1) return;
  if (points.length === 2) {
    ctx.lineTo(points[1].x, points[1].y);
    return;
  }

  for (let index = 1; index < points.length - 1; index += 1) {
    const current = points[index];
    const next = points[index + 1];
    const midX = (current.x + next.x) / 2;
    const midY = (current.y + next.y) / 2;
    ctx.quadraticCurveTo(current.x, current.y, midX, midY);
  }

  const last = points[points.length - 1];
  ctx.lineTo(last.x, last.y);
}

function drawEmptyChart(canvas, text) {
  const { ctx, width, height } = setupCanvas(canvas);
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = getCssVar('--bg');
  ctx.fillRect(0, 0, width, height);
  drawCenteredText(ctx, width, height, text);
}

function drawCenteredText(ctx, width, height, text) {
  ctx.save();
  ctx.fillStyle = getCssVar('--muted');
  ctx.font = '12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, width / 2, height / 2);
  ctx.restore();
}

function xToPx(value, plot, config) {
  return plot.x + ((value - config.xMin) / Math.max(config.xMax - config.xMin, 1)) * plot.w;
}

function yToPx(value, plot, config) {
  return plot.y + (1 - (value - config.yMin) / Math.max(config.yMax - config.yMin, 1)) * plot.h;
}

function buildTicks(min, max, count) {
  if (count <= 1) return [min];
  const ticks = [];
  for (let index = 0; index < count; index += 1) {
    ticks.push(min + ((max - min) * index) / (count - 1));
  }
  return ticks;
}

function buildRelativeTimeTicks(startMs, endMs) {
  const ticks = [];
  for (let tsMs = startMs; tsMs <= endMs + 1; tsMs += 30 * 1000) {
    ticks.push(tsMs);
  }
  return ticks;
}

function formatRelativeChartTime(tsMs, startMs) {
  const elapsedS = Math.max(Math.round((tsMs - startMs) / 1000), 0);
  const minutes = Math.floor(elapsedS / 60).toString().padStart(2, '0');
  const seconds = (elapsedS % 60).toString().padStart(2, '0');
  return `${minutes}:${seconds}`;
}

function formatCountdownTime(durationMs) {
  const remainingS = Math.max(Math.ceil(durationMs / 1000), 0);
  const minutes = Math.floor(remainingS / 60).toString().padStart(2, '0');
  const seconds = (remainingS % 60).toString().padStart(2, '0');
  return `${minutes}:${seconds}`;
}

function getLatestVisibleSampleTs(config) {
  let latestTsMs = null;
  for (const series of config.series) {
    for (const sample of series.samples) {
      if (sample.y == null || sample.x < config.xMin || sample.x > config.xMax) continue;
      if (latestTsMs == null || sample.x > latestTsMs) {
        latestTsMs = sample.x;
      }
    }
  }
  return latestTsMs;
}

function shouldLabelRelativeTick(tsMs, startMs, endMs) {
  const elapsedS = Math.round((tsMs - startMs) / 1000);
  return elapsedS % 60 === 0 || tsMs === endMs;
}

function getCssVar(name) {
  if (!cssVars.has(name)) {
    cssVars.set(name, getComputedStyle(document.documentElement).getPropertyValue(name).trim());
  }
  return cssVars.get(name);
}

window.addEventListener('resize', () => {
  cssVars.clear();
  renderDetails();
});

function startChartAnimation() {
  if (chartAnimationFrame != null) return;
  const scheduleFrame = window.requestAnimationFrame || (callback => setTimeout(() => callback(Date.now()), 16));

  const animate = nowMs => {
    if (nowMs - lastChartRenderMs >= CHART_SAMPLE_INTERVAL_MS) {
      lastChartRenderMs = nowMs;
      renderDetails();
    }
    chartAnimationFrame = scheduleFrame(animate);
  };

  chartAnimationFrame = scheduleFrame(animate);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden || !activeMarketId) return;
  loadMarketHistory(activeMarketId).then(() => {
    sampleActiveChart(Date.now(), true);
    renderActiveDetail();
  });
});

renderActiveDetail();
startChartAnimation();
loadInitialMarkets().finally(connect);
</script>
</body>
