<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BTC Combined Price</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --border: #d9dde3;
      --grid: #e6e9ee;
      --text: #20242c;
      --muted: #6d7683;
      --green: #178c4f;
      --red: #c33d44;
      --coinbase: #2558d9;
      --binance: #d89b00;
      --gemini: #008f7a;
      --bitstamp: #7b4cc2;
      --bybit: #cf4a7a;
      --combined: #f08c00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .shell {
      height: 100vh;
      padding: 20px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 14px;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      align-content: start;
      min-width: 0;
    }

    .dashboardGrid {
      min-height: 0;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 14px;
      overflow: hidden;
    }

    .quote {
      min-width: 0;
      min-height: 74px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 8px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
    }

    .quoteMain,
    .quoteMeta {
      min-width: 0;
    }

    .label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      text-transform: uppercase;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      flex: 0 0 auto;
      background: currentColor;
    }

    .price {
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
      font-size: 22px;
      font-weight: 760;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .baseline {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      font-weight: 650;
      color: var(--muted);
    }

    .change {
      font-variant-numeric: tabular-nums;
      font-size: 14px;
      font-weight: 700;
    }

    .meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 7px;
      white-space: nowrap;
    }

    .delay {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      font-weight: 650;
      min-height: 15px;
    }

    .positive { color: var(--green); }
    .negative { color: var(--red); }

    .chartPanel {
      min-height: 0;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 8px;
      padding: 14px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
      overflow: hidden;
    }

    .chartHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      min-width: 0;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .legendItem {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 650;
      white-space: nowrap;
    }

    .window {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .chartWrap {
      min-height: 0;
      position: relative;
    }

    #chart {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 1180px) {
      .dashboardGrid {
        grid-template-columns: 260px minmax(0, 1fr);
      }
    }

    @media (max-width: 620px) {
      body { overflow: auto; }
      .shell { padding: 12px; }
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
      .dashboardGrid {
        grid-template-columns: 1fr;
        overflow: visible;
      }
      .chartPanel {
        min-height: 420px;
      }
      .price { font-size: 21px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1>BTC Exchange Composite</h1>
      <div class="status" id="status">Connecting</div>
    </header>

    <section class="dashboardGrid">
      <section class="summary" id="summary"></section>

      <section class="chartPanel">
        <div class="chartHeader">
          <div class="legend" id="legend"></div>
          <div class="window" id="window">Window --</div>
        </div>
        <div class="chartWrap">
          <div id="chart"></div>
        </div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script>
    const series = [
      { key: "bybit", name: "Bybit", color: "#cf4a7a" },
      { key: "gemini", name: "Gemini", color: "#008f7a" },
      { key: "binance", name: "Binance", color: "#d89b00" },
      { key: "bitstamp", name: "Bitstamp", color: "#7b4cc2" },
      { key: "coinbase", name: "Coinbase", color: "#2558d9" },
      { key: "combined", name: "Combined", color: "#f08c00", width: 3 },
    ];

    const chartWindowMs = 30_000;
    const chartXAxisIntervalMs = 6_000;
    const chartRenderIntervalMs = 50;
    const maxChartPoints = 12_000;
    const points = [];
    let latest = null;
    let socket = null;
    let reconnectTimer = null;
    let chartNeedsUpdate = false;
    let chartTimer = null;
    let lastChartRenderAt = 0;

    const statusEl = document.getElementById("status");
    const summaryEl = document.getElementById("summary");
    const legendEl = document.getElementById("legend");
    const windowEl = document.getElementById("window");
    const chartEl = document.getElementById("chart");
    const chart = echarts.init(chartEl, null, { renderer: "canvas" });

    const priceFormat = new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "USD",
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    });

    function isNumber(value) {
      return Number.isFinite(value);
    }

    function formatPrice(value) {
      return isNumber(value) ? priceFormat.format(value) : "--";
    }

    function signed(value) {
      if (!isNumber(value)) {
        return "--";
      }
      const sign = value >= 0 ? "+" : "";
      return sign + priceFormat.format(value);
    }

    function formatDelay(value) {
      return isNumber(value) ? value.toFixed(1) + " ms" : "--";
    }

    function timeLabel(seconds) {
      return new Date(seconds * 1000).toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      });
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function renderStaticUi() {
      summaryEl.innerHTML = series.map((item) => [
        "<article class=\"quote\">",
        "<div class=\"quoteMain\">",
        "<div class=\"label\" style=\"color:", item.color, "\">",
        "<span class=\"dot\"></span><span>", item.name, "</span>",
        "</div>",
        "<div class=\"price\" id=\"price-", item.key, "\">--</div>",
        "</div>",
        "<div class=\"meta\">",
        "<div class=\"baseline\" id=\"baseline-", item.key, "\">--</div>",
        "<div class=\"change\" id=\"change-", item.key, "\">--</div>",
        item.key === "combined" ? "<div class=\"delay\"></div>" : "<div class=\"delay\" id=\"delay-" + item.key + "\">--</div>",
        "</div>",
        "</article>",
      ].join("")).join("");

      legendEl.innerHTML = series.map((item) => [
        "<span class=\"legendItem\" style=\"color:", item.color, "\">",
        "<span class=\"dot\"></span>", item.name,
        "</span>",
      ].join("")).join("");
    }

    function updateSummary(snapshot) {
      for (const item of series) {
        const price = exPrice(snapshot, item.key);
        const baseline = exBaseline(snapshot, item.key);
        const change = exChange(snapshot, item.key);
        const priceEl = document.getElementById("price-" + item.key);
        const baselineEl = document.getElementById("baseline-" + item.key);
        const changeEl = document.getElementById("change-" + item.key);
        priceEl.textContent = formatPrice(price);
        baselineEl.textContent = formatPrice(baseline);
        changeEl.textContent = signed(change);
        changeEl.className = "change " + (isNumber(change) && change >= 0 ? "positive" : "negative");

        if (item.key !== "combined") {
          document.getElementById("delay-" + item.key).textContent = formatDelay(exDelay(snapshot, item.key));
        }
      }

      windowEl.textContent = "Window " + timeLabel(snapshot.window_start) + " - " + timeLabel(snapshot.window_end);
      setStatus("Live " + new Date(snapshot.timestamp).toLocaleTimeString());
    }

    function exPrice(snapshot, key) {
      return key === "combined" ? snapshot.price : snapshot.exchanges[key]?.price;
    }

    function exDelay(snapshot, key) {
      return snapshot.exchanges[key]?.delay;
    }

    function exBaseline(snapshot, key) {
      return key === "combined" ? snapshot.baseline : snapshot.exchanges[key]?.baseline;
    }

    function exChange(snapshot, key) {
      return key === "combined" ? snapshot.change : snapshot.exchanges[key]?.change;
    }

    function ingest(snapshot) {
      latest = snapshot;
      points.push(snapshot);

      const minTs = snapshot.timestamp - chartWindowMs;
      while (points.length && points[0].timestamp < minTs) {
        points.shift();
      }

      if (points.length > maxChartPoints) {
        points.splice(0, points.length - maxChartPoints);
      }

      updateSummary(snapshot);
      scheduleChartUpdate();
    }

    function paddedRange(min, max) {
      const span = Math.max(max - min, 2);
      const pad = Math.max(span * 0.18, 1);
      return [
        Math.floor((min - pad) / 10) * 10,
        Math.ceil((max + pad) / 10) * 10,
      ];
    }

    function priceExtent() {
      let minValue = Infinity;
      let maxValue = -Infinity;
      for (const point of points) {
        for (const item of series) {
          const price = exPrice(point, item.key);
          if (isNumber(price)) {
            if (price < minValue) minValue = price;
            if (price > maxValue) maxValue = price;
          }
        }
      }

      if (!Number.isFinite(minValue) || !Number.isFinite(maxValue)) {
        return null;
      }

      return paddedRange(minValue, maxValue);
    }

    function seriesData(item) {
      return points
        .map((point) => {
          const price = exPrice(point, item.key);
          return isNumber(price) ? [point.timestamp, price] : null;
        })
        .filter(Boolean);
    }

    function scheduleChartUpdate() {
      chartNeedsUpdate = true;
      if (chartTimer !== null) {
        return;
      }
      const elapsed = Date.now() - lastChartRenderAt;
      const delay = Math.max(0, chartRenderIntervalMs - elapsed);
      chartTimer = setTimeout(() => {
        chartTimer = null;
        if (chartNeedsUpdate) {
          chartNeedsUpdate = false;
          lastChartRenderAt = Date.now();
          updateChart();
        }
      }, delay);
    }

    function chartAxisEnd() {
      return Math.floor(Date.now() / chartRenderIntervalMs) * chartRenderIntervalMs;
    }

    function xAxisGraphics(startMs, endMs) {
      const chartWidth = chartEl.clientWidth;
      const chartHeight = chartEl.clientHeight;
      const gridLeft = 18;
      const gridRight = 78;
      const gridBottom = 36;
      const plotWidth = Math.max(1, chartWidth - gridLeft - gridRight);
      const plotBottom = chartHeight - gridBottom;
      const firstTick = Math.ceil(startMs / chartXAxisIntervalMs) * chartXAxisIntervalMs;
      const graphics = [];

      for (let tick = firstTick; tick <= endMs; tick += chartXAxisIntervalMs) {
        const x = gridLeft + ((tick - startMs) / chartWindowMs) * plotWidth;
        graphics.push({
          type: "line",
          silent: true,
          shape: { x1: x, y1: plotBottom, x2: x, y2: plotBottom + 4 },
          style: { stroke: "#6d7683", lineWidth: 1, opacity: 0.45 },
        });
        graphics.push({
          type: "text",
          silent: true,
          x,
          y: plotBottom + 13,
          style: {
            text: timeLabel(tick / 1000),
            fill: "#6d7683",
            font: "12px ui-sans-serif, system-ui, sans-serif",
            textAlign: "center",
            textVerticalAlign: "top",
          },
        });
      }

      return graphics;
    }

    function updateChart() {
      if (!latest || points.length === 0) {
        return;
      }

      const range = priceExtent();
      if (!range) {
        return;
      }

      const endMs = chartAxisEnd();
      const startMs = endMs - chartWindowMs;
      const [minPrice, maxPrice] = range;
      const baseline = latest.baseline;

      chart.setOption({
        animation: false,
        graphic: xAxisGraphics(startMs, endMs),
        grid: {
          left: 18,
          right: 78,
          top: 18,
          bottom: 36,
          containLabel: false,
        },
        tooltip: {
          trigger: "axis",
          confine: true,
          valueFormatter: (value) => formatPrice(value),
          axisPointer: {
            type: "line",
            lineStyle: { color: "#9aa3ad", width: 1 },
          },
        },
        xAxis: {
          type: "value",
          min: startMs,
          max: endMs,
          interval: chartXAxisIntervalMs,
          minInterval: chartXAxisIntervalMs,
          maxInterval: chartXAxisIntervalMs,
          axisLabel: {
            show: false,
          },
          axisLine: { show: false },
          axisTick: { show: false },
          splitLine: { show: false },
        },
        yAxis: {
          type: "value",
          position: "right",
          min: minPrice,
          max: maxPrice,
          interval: 10,
          scale: true,
          axisLabel: {
            color: "#6d7683",
            formatter: (value) => "$" + value.toLocaleString("en-US", { maximumFractionDigits: 0 }),
          },
          axisLine: { show: false },
          axisTick: { show: false },
          splitLine: {
            lineStyle: { color: "#e6e9ee", width: 1 },
          },
        },
        series: series.map((item) => ({
          name: item.name,
          type: "line",
          data: seriesData(item),
          smooth: 0.35,
          smoothMonotone: "x",
          showSymbol: false,
          connectNulls: false,
          lineStyle: {
            color: item.color,
            width: item.width || 1.8,
          },
          itemStyle: { color: item.color },
          emphasis: { focus: "series" },
          markLine: item.key === "combined" && isNumber(baseline) ? {
            silent: true,
            symbol: "none",
            lineStyle: {
              color: item.color,
              opacity: 0.45,
              type: "dashed",
              width: 1.5,
            },
            label: { show: false },
            data: [{ yAxis: baseline }],
          } : undefined,
        })),
      }, { notMerge: true, lazyUpdate: true });
    }

    function connect() {
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      socket = new WebSocket(protocol + "//" + window.location.host + "/ws");

      socket.onopen = () => {
        setStatus("Connected");
      };

      socket.onmessage = (event) => {
        ingest(JSON.parse(event.data));
      };

      socket.onclose = () => {
        setStatus("Reconnecting");
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, 1000);
      };

      socket.onerror = () => {
        setStatus("Reconnecting");
        socket.close();
      };
    }

    renderStaticUi();
    connect();
    window.addEventListener("resize", () => {
      chart.resize();
      scheduleChartUpdate();
    });
    chart.setOption({
      animation: false,
      grid: { left: 18, right: 78, top: 18, bottom: 36 },
      xAxis: { type: "value", axisLine: { show: false }, axisTick: { show: false } },
      yAxis: { type: "value", position: "right", axisLine: { show: false }, axisTick: { show: false } },
      graphic: {
        type: "text",
        left: 18,
        top: 18,
        style: {
          text: "Waiting for exchange feeds",
          fill: "#6d7683",
          font: "14px ui-sans-serif, system-ui, sans-serif",
        },
      },
    });
  </script>
</body>
</html>
